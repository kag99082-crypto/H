
name: Inspect Suspicious Domain Redirect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - name: Prepare lab directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Lab | Out-Null

      - name: Inspect HTTPS response without following redirects
        shell: pwsh
        run: |
          $url = "https://get.activate.win/"

          Write-Host "Target: $url"

          curl.exe `
            --silent `
            --show-error `
            --max-time 25 `
            --max-redirs 0 `
            --dump-header C:\Lab\response_headers.txt `
            --output NUL `
            --write-out "HTTP status: %{http_code}`nRedirect target: %{redirect_url}`n" `
            "$url"

          Write-Host "`n--- Response headers ---"

          if (Test-Path C:\Lab\response_headers.txt) {
            Get-Content C:\Lab\response_headers.txt
          }

      - name: Save inspection metadata
        if: always()
        shell: pwsh
        run: |
          $file = "C:\Lab\response_headers.txt"

          if (Test-Path $file) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            $size = (Get-Item $file).Length

            @"
          Target: https://get.activate.win/
          Collected: $(Get-Date -Format o)
          Header file size: $size
          Header SHA256: $hash
          "@ | Out-File C:\Lab\metadata.txt -Encoding utf8
          }

      - name: Upload inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redirect-inspection
          path: C:\Lab\
          if-no-files-found: warn
          retention-days: 3
