
name: Download Response

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: windows-latest

    steps:
      - name: Download response
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\Lab | Out-Null

          $url = "http://activate.win/"

          curl.exe `
            --location `
            --max-redirs 5 `
            --proto "=http,https" `
            --proto-redir "=http,https" `
            --max-time 60 `
            --dump-header C:\Lab\headers.txt `
            --output C:\Lab\response.bin `
            --write-out "`nHTTP status: %{http_code}`nFinal URL: %{url_effective}`nDownloaded: %{size_download} bytes`n" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Download failed: curl exit code $LASTEXITCODE"
          }

          Get-FileHash C:\Lab\response.bin -Algorithm SHA256
          Get-Item C:\Lab\response.bin |
            Select-Object Name, Length

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-response
          path: C:\Lab\
          if-no-files-found: warn
          retention-days: 3
