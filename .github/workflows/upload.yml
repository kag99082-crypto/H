
name: Download and Upload to Telegram

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Magnet link or direct URL"
        required: true
      chunk_mb:
        description: "Chunk size in MB (max 1900)"
        required: true
        default: "1900"

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          pip install telethon

      - name: Download
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          mkdir -p downloads chunks

          aria2c \
            --dir=downloads \
            --seed-time=0 \
            --file-allocation=none \
            --max-connection-per-server=16 \
            --bt-max-peers=100 \
            --summary-interval=30 \
            "$SOURCE"

          echo "Download completed"

          if ! find downloads -type f -print -quit | grep -q .; then
            echo "No downloaded files"
            exit 1
          fi

      - name: Split files
        env:
          CHUNK_MB: ${{ inputs.chunk_mb }}
        run: |
          set -euo pipefail

          [[ "$CHUNK_MB" =~ ^[0-9]+$ ]] &&
          [ "$CHUNK_MB" -ge 1 ] &&
          [ "$CHUNK_MB" -le 1900 ]

          find downloads -type f -print0 |
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")

            split \
              -b "${CHUNK_MB}M" \
              -d \
              --numeric-suffixes=0 \
              --suffix-length=3 \
              "$file" \
              "chunks/${filename}.part_"
          done

          COUNT=$(find chunks -type f | wc -l)

          echo "Chunks created: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            exit 1
          fi

      - name: Create channel and upload
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python3 scripts/transfer.py
